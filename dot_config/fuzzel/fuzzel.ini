# ~/.config/fuzzel/fuzzel.ini
# Configuration for the Fuzzel application launcher

[main]
# Set the font (ensure you have Nerd Fonts installed)
font=FiraCode Nerd Font:size=12
prompt="❯ "
icons-enabled=yes
icon-theme=Papirus
width=30
horizontal-pad=20
#launch-prefix="gtk-launch "

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

[border]
width=2
radius=10

# Sample Input: Pressing the Super key + D (if bound)
# Expected Output: A centered overlay showing a list of installed apps
