# /etc/sysctl.d/99-powertweaks.conf

# Force the kernel to wait 60 seconds before waking up the SSD for house-keeping
# This matches the commit=60 option in fstab
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 6000

# Reactively flush dirty data when the disk is already awake (e.g., during a read)
# This keeps the NVMe in deep sleep states longer
vm.laptop_mode = 5

# Optimized for ZRAM (zram-generator)
# 180 ensures inactive data is compressed into ZRAM early,
# keeping regular RAM free for the file cache and active apps.
vm.swappiness = 180
