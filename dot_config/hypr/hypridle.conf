# Hypridle 
# Original config submitted by https://github.com/SherLock707

$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    lock_cmd = pidof hyprlock || hyprlock # runs hyprlock if it is not already running (this is always run when "loginctl lock-session" is called) 
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    # Lid-close suspend is handled by systemd-logind; this daemon only locks
    # before sleep and restores the display after resume.
    # hypridle holds a logind sleep "delay" inhibitor and releases it only once
    # before_sleep_cmd returns. A blocking lock command therefore makes logind
    # wait out the whole InhibitDelayMaxSec (30s on Ubuntu) before every suspend,
    # so lock in the background and let hypridle release the inhibitor at once.
    before_sleep_cmd = loginctl lock-session &   # lock the session without blocking suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # turn on screen after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# All idle listeners and automatic timeouts are disabled.

