# televison cheet sheet
windowrule {
    name = cheat_sheet_popup
    match:class = floating_cheat
    float = on
    size = 800 500
    center = on
    pin = on
}

# satty screenshot tool
windowrule {
    name = satty_screenshot
    match:class = .*satty.*
    float = on
    size = 1425 800
    center = on
    rounding = 12
}
