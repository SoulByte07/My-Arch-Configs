# safe eyes is a break reminder tool
#exec-once=flatpak run io.github.slgobinath.SafeEyes

# pomodoro timer
exec-once= /home/soul/.config/hypr/UserScripts/hypr-pomodoro-timer.sh 25 5

# nightmode
#exec-once = wlsunset -l 16.5 -L 81.5
exec-once= wlsunset -S 07:00 -s 18:00 -t 4000

# tmux session server
#exec-once = tmux start-server

# Bar selection logic
# waybar is started by default in configs/Startup_Apps.conf
# This logic will switch to slstatus if requested by the login session
exec-once = bash -c 'if [ "$HYPR_BAR_MODE" == "slstatus" ]; then pkill waybar; slstatus -s | wayout; fi'
