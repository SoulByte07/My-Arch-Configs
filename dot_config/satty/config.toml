# ==========================================
# Sample Input: Satty launches via screenshot script.
# Expected Output: Opens fullscreen, Catppuccin colors, FiraCode font, blur tool active. Exits gracefully after copy/save. 
# ==========================================

[general]
fullscreen = false 
early-exit = true
initial-tool = "blur"
copy-command = "wl-copy"
annotation-size-factor = 2
output-filename = "~/Pictures/Screenshots/satty-%Y%m%d_%H%M%S.png"
save-after-copy = true
default-hide-toolbars = false
primary-highlighter = "block"
disable-notifications = false
brush-smooth-history-size = 10

[keybinds]
pointer = "p"
crop = "c"
brush = "h"
line = "l"
arrow = "a"
rectangle = "r"
text = "t"
blur = "b"
highlight = "h"

[font]
family = "FiraCode Nerd Font"
style = "Regular"

[color-palette]
# Catppuccin Mocha inspired palette for the toolbar
palette = [
    "#89b4fa", # Blue
    "#f38ba8", # Red
    "#a6e3a1", # Green
    "#f9e2af", # Yellow
    "#cba6f7", # Mauve
    "#fab387", # Peach
]
